name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, no extra deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Doctor self-check
        run: python -m phaseledger doctor --root "${{ github.workspace }}"

      - name: CLI user-path smoke
        run: |
          set -euo pipefail
          LEDGER="${{ runner.temp }}/phaseledger-ci"
          python -m phaseledger init --ledger "$LEDGER"
          python -m phaseledger status --ledger "$LEDGER"
          python -m phaseledger measure fixtures/complete.json
          # incomplete must be fail-closed exit code 4 (not success)
          set +e
          python -m phaseledger measure fixtures/incomplete.json
          code=$?
          set -e
          test "$code" -eq 4
          python -m phaseledger ncycle --dir "${{ runner.temp }}/ncycle" --count 2
          python -m phaseledger maintenance --ledger "${{ runner.temp }}/maint" --steps 2
          python -m phaseledger verify --ledger "${{ runner.temp }}/maint"

  package:
    name: package metadata
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist/wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: List artifacts
        run: ls -la dist/
