[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phaseledger"
version = "0.5.0"
description = "Local-first phase ledger: every phase advance requires a fresh deterministic measurer verdict."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nelson", email = "noreply@example.com" }]
keywords = ["evidence", "deterministic", "local-first", "measurer", "phase-gate"]

[project.scripts]
phaseledger = "phaseledger.cli:main"

[tool.setuptools.packages.find]
include = ["phaseledger*"]
